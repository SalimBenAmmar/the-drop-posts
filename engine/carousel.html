<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Oswald;font-weight:700;src:url("node_modules/@fontsource/oswald/files/oswald-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:Inter;font-weight:400;src:url("node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:Inter;font-weight:700;src:url("node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2") format("woff2")}
:root{--blue:#012169;--red:#C8102E;--white:#FFFFFF;--soft:#F3F5FA}
html,body{margin:0}
.s{width:1080px;height:1350px;box-sizing:border-box;padding:76px 80px 64px;background:var(--white);color:var(--blue);font-family:Inter;position:relative;overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:22px;font-size:26px;letter-spacing:5px;font-weight:700}
.badge{background:var(--red);color:#fff;padding:10px 16px}
.page{margin-left:auto}
.bars{display:flex;gap:10px;margin-top:22px}.bars i{flex:1;height:5px;background:rgba(1,33,105,.12)}.bars i.on{background:var(--blue)}.bars i.cur{background:var(--red)}
.tag{display:inline-block;border:3px solid var(--blue);padding:10px 18px;font-size:26px;letter-spacing:5px;font-weight:700;margin-top:52px;align-self:flex-start}
.tag:before{content:"";display:inline-block;width:14px;height:14px;background:var(--blue);margin-right:14px;vertical-align:2px}
h1{font-family:Oswald;font-weight:700;font-size:128px;line-height:.98;margin:30px 0 0;text-transform:uppercase;letter-spacing:-1px}
h1 em{font-style:normal;color:var(--red);display:block}
h1.sm{font-size:104px}
p.lead{font-size:38px;line-height:1.45;margin:30px 0 0;max-width:900px}
.foot{margin-top:auto;border-top:2px solid rgba(1,33,105,.15);padding-top:26px;display:flex;align-items:center;font-size:24px;letter-spacing:5px;font-weight:700}
.foot b{font-family:Oswald;font-size:34px;letter-spacing:1px;margin-right:18px}
.foot .swipe{margin-left:auto;color:var(--red)}
.src{font-size:22px;letter-spacing:4px;margin-top:auto;padding-top:20px;opacity:.75}
.tl{margin-top:44px;border-left:4px solid rgba(1,33,105,.2);padding-left:44px;display:flex;flex-direction:column;gap:38px}
.tl div{position:relative}.tl div:before{content:"";position:absolute;left:-66px;top:4px;width:30px;height:30px;border-radius:50%;background:#fff;border:5px solid var(--blue)}
.tl div.hot:before{background:var(--red);border-color:var(--red);box-shadow:0 0 0 10px rgba(200,16,46,.15)}
.tl small{display:block;color:var(--red);font-size:26px;letter-spacing:5px;font-weight:700}
.tl span{font-size:38px;font-weight:700}
.big{display:flex;gap:40px;margin-top:60px}
.big div{flex:1;background:var(--soft);padding:40px}
.big strong{font-family:Oswald;font-size:170px;line-height:1;display:block}
.big small{font-size:28px;letter-spacing:5px;font-weight:700}
.scale{margin-top:56px;display:flex;flex-direction:column;gap:14px}
.scale div{white-space:nowrap;display:flex;align-items:center;gap:24px;font-size:34px}
.scale i{display:block;height:58px;background:rgba(1,33,105,.12)}
.scale div.hot i{background:var(--red)}
.scale div.hot{font-weight:700}
.scale b{width:330px;font-weight:700;font-size:30px;letter-spacing:3px}
.tips{margin-top:50px;display:flex;flex-direction:column;gap:30px}
.tips div{display:flex;gap:30px;align-items:flex-start;font-size:38px;line-height:1.35}
.tips span{font-family:Oswald;font-size:64px;line-height:1;color:var(--red);width:60px;flex:none}
.visual{margin-top:auto;display:flex;justify-content:center}
.cta{background:var(--blue);color:#fff;padding:34px 40px;margin-top:44px;font-size:36px;line-height:1.4}
.cta b{font-family:Oswald;font-size:56px;display:block;letter-spacing:.5px}
</style></head>
<body><div id="root"></div>
<script>
let DATA = null, N = 7;
const esc = (x) => String(x ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
function shell(i, inner, src, last) {
  const bars = Array.from({ length: N }, (_, k) => `<i class="${k < i ? 'on' : k === i ? 'cur' : ''}"></i>`).join('');
  return `<div class="s"><div class="top"><span class="badge">THE DROP · UK</span><span>${esc(DATA.topic || 'UK WATER')}</span><span class="page">0${i + 1} / 0${N}</span></div><div class="bars">${bars}</div>${inner}${src ? `<div class="src">SOURCE — ${esc(src)}</div>` : ''}<div class="foot"><b>THE DROP</b>UK WATER SCIENCE<span class="swipe">${last ? 'FOLLOW +' : 'SWIPE →'}</span></div></div>`;
}
const ICONS = {
  kettle: `<svg width="400" height="360" viewBox="-330 -280 660 600" aria-hidden="true"><g fill="none" stroke="#012169" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"><path d="M-200 260 L-160 -180 L160 -180 L200 260 Z"/><path d="M-120 -180 Q0 -260 120 -180"/><path d="M180 -120 C330 -120 330 160 190 160"/></g><circle cx="0" cy="-232" r="20" fill="#012169"/><path d="M-182 70 L-300 -110 L-262 -126 L-170 -20 Z" fill="#012169"/><rect x="-240" y="270" width="480" height="34" rx="12" fill="#012169"/><path d="M-188 248 L-188 210 Q-170 190 -150 212 Q-120 186 -95 214 Q-60 190 -40 212 Q-5 186 20 214 Q55 188 80 212 Q115 190 140 214 Q165 192 188 210 L188 248 Z" fill="#C8102E"/></svg>`,
  drop: `<svg width="340" height="410" viewBox="-120 -160 240 330" aria-hidden="true"><path d="M0 -150 C-40 -80 -105 -20 -105 50 C-105 115 -58 160 0 160 C58 160 105 115 105 50 C105 -20 40 -80 0 -150 Z" fill="#012169"/><circle cx="-40" cy="50" r="15" fill="#fff"/><circle cx="35" cy="0" r="11" fill="#fff"/><circle cx="10" cy="95" r="13" fill="#fff"/><circle cx="55" cy="75" r="17" fill="#C8102E"/><circle cx="-50" cy="-10" r="8" fill="#fff"/></svg>`,
  flask: `<svg width="340" height="400" viewBox="-170 -200 340 400" aria-hidden="true"><g fill="none" stroke="#012169" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"><path d="M-50 -170 L50 -170 M-35 -170 L-35 -40 L-140 150 Q-150 175 -120 175 L120 175 Q150 175 140 150 L35 -40 L35 -170"/></g><path d="M-95 75 L95 75 L130 150 Q136 162 120 162 L-120 162 Q-136 162 -130 150 Z" fill="#C8102E"/></svg>`,
  pin: `<svg width="300" height="360" viewBox="-150 -170 300 360" aria-hidden="true"><path d="M0 175 C-20 120 -125 40 -125 -40 C-125 -110 -70 -160 0 -160 C70 -160 125 -110 125 -40 C125 40 20 120 0 175 Z" fill="#012169"/><circle cx="0" cy="-40" r="52" fill="#C8102E"/></svg>`,
  tap: `<svg width="380" height="380" viewBox="-200 -200 400 400" aria-hidden="true"><g fill="none" stroke="#012169" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"><path d="M-170 -60 L40 -60 Q110 -60 110 10 L110 40"/><path d="M-170 -110 L-170 -10"/><path d="M-40 -60 L-40 -130 M-90 -130 L10 -130"/></g><path d="M110 90 C95 115 80 132 80 150 C80 168 94 180 110 180 C126 180 140 168 140 150 C140 132 125 115 110 90 Z" fill="#C8102E"/></svg>`,
  none: ''
};
// Slide types: cover, text, steps, stats, scale, tips. Each slide may set tag, l1, l2 (red), lead, source.
function head(sl, big) { return `<div class="tag">${esc(sl.tag)}</div><h1${big ? '' : ' class="sm"'}>${esc(sl.l1)}<em>${esc(sl.l2)}</em></h1>`; }
const T = {
  cover: (sl) => `${head(sl, true)}${sl.lead ? `<p class="lead">${esc(sl.lead)}</p>` : ''}<div class="visual">${ICONS[sl.icon || 'drop']}</div>`,
  text: (sl) => `${head(sl, sl.big)}${(sl.paras || [sl.lead]).map((x) => `<p class="lead">${esc(x)}</p>`).join('')}${sl.icon ? `<div class="visual">${ICONS[sl.icon]}</div>` : ''}`,
  steps: (sl) => `${head(sl)}<div class="tl">${sl.steps.map((x, k) => `<div class="${k === (sl.hot ?? 1) ? 'hot' : ''}"><small>STEP ${k + 1}</small><span>${esc(x)}</span></div>`).join('')}</div>`,
  stats: (sl) => `${head(sl)}<div class="big">${sl.items.map((it) => `<div><strong${it.red ? ' style="color:#C8102E"' : ''}>${esc(it.v)}</strong><small>${esc(it.l)}</small></div>`).join('')}</div>${sl.lead ? `<p class="lead">${esc(sl.lead)}</p>` : ''}`,
  scale: (sl) => { const mx = Math.max(...sl.rows.map((r) => r.w || 1)); return `${head(sl)}<div class="scale">${sl.rows.map((r) => `<div class="${r.hot ? 'hot' : ''}"><b>${esc(r.b)}</b><i style="width:${Math.round(320 * (r.w || 1) / mx)}px"></i>${esc(r.t)}</div>`).join('')}</div>${sl.lead ? `<p class="lead">${esc(sl.lead)}</p>` : ''}`; },
  tips: (sl) => `${head(sl)}<div class="tips">${sl.tips.map((x, k) => `<div><span>${k + 1}</span>${esc(x)}</div>`).join('')}</div>${sl.cta ? `<div class="cta"><b>${esc(sl.cta[0])}</b>${esc(sl.cta[1])}</div>` : ''}`
};
window.setData = (d) => { DATA = d; N = d.slides.length; };
window.show = (i) => { const sl = DATA.slides[i]; document.getElementById('root').innerHTML = shell(i, T[sl.type](sl), sl.source, i === N - 1); return document.fonts.ready.then(() => true); };
</script></body></html>
