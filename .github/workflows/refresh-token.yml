name: Refresh Instagram token

# Instagram-login tokens last 60 days; this refreshes them every Monday so they never lapse.
# Business (system-user) tokens never expire, so for those this job does nothing.
# If a refresh returns a different token string, it is saved back to IG_ACCESS_TOKEN,
# which needs a GH_PAT secret (fine-grained token with "Secrets: read and write" on this repo).

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then echo "No IG_ACCESS_TOKEN yet; skipping."; exit 0; fi
          me=$(curl -s "https://graph.instagram.com/me?fields=username&access_token=${IG_ACCESS_TOKEN}")
          if [ -z "$(echo "$me" | jq -r '.username // empty')" ]; then
            echo "This is a business token that never expires; nothing to refresh."
            exit 0
          fi
          resp=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")
          new=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$new" ]; then
            echo "Refresh failed: $(echo "$resp" | jq -c '.error.message // .')"
            exit 1
          fi
          echo "::add-mask::$new"
          days=$(echo "$resp" | jq -r '(.expires_in // 0) / 86400 | floor')
          echo "Token refreshed, valid for $days more days."
          if [ "$new" = "$IG_ACCESS_TOKEN" ]; then
            echo "Token string unchanged; nothing to save."
          elif [ -n "$GH_PAT" ]; then
            echo "$new" | GH_TOKEN="$GH_PAT" gh secret set IG_ACCESS_TOKEN -R "$GITHUB_REPOSITORY"
            echo "New token saved to IG_ACCESS_TOKEN."
          else
            echo "::warning::The token string changed but no GH_PAT secret exists to save it. Add GH_PAT or regenerate the token before it expires."
          fi
