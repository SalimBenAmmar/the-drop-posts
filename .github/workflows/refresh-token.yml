name: Refresh Instagram token

# Instagram tokens last 60 days. This refreshes it every Monday so it never expires.
# If the refreshed token is a new string, it is saved back to the IG_ACCESS_TOKEN secret,
# which needs a GH_PAT secret (fine-grained token with "Secrets: read and write" on this repo).

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          resp=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")
          new=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$new" ]; then
            echo "Refresh failed: $(echo "$resp" | jq -c '.error.message // .')"
            exit 1
          fi
          echo "::add-mask::$new"
          days=$(echo "$resp" | jq -r '(.expires_in // 0) / 86400 | floor')
          echo "Token refreshed, valid for $days more days."
          if [ "$new" = "$IG_ACCESS_TOKEN" ]; then
            echo "Token string unchanged; nothing to save."
          elif [ -n "$GH_PAT" ]; then
            echo "$new" | GH_TOKEN="$GH_PAT" gh secret set IG_ACCESS_TOKEN -R "$GITHUB_REPOSITORY"
            echo "New token saved to IG_ACCESS_TOKEN."
          else
            echo "::warning::The token string changed but no GH_PAT secret exists to save it. Add GH_PAT or regenerate the token before it expires."
          fi
