name: Publish due posts

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = test the connection only, publish = post anything due now'
        type: choice
        default: check
        options: [check, publish]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          MEDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "check" ]; then
            node scripts/publish.mjs --check
          else
            node scripts/publish.mjs
          fi

      - name: Save results
        if: always()
        run: |
          git config user.name "the-drop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in queue posted failed status.json; do
            if [ -e "$p" ] || git ls-files --error-unmatch "$p" >/dev/null 2>&1; then git add -A "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record publishing results"
            git pull --rebase origin main
            git push
          fi
